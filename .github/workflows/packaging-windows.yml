name: Windows Packaging & Release

on:
  push:
    branches: [main]
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    name: Package and Verify Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies with packaging extra and dev group
        run: uv sync --extra cli --group dev

      - name: Run unit, bootstrap, contract, and update tests
        run: uv run pytest tests/surfaces/test_cli_config.py tests/surfaces/test_cli_moment.py tests/surfaces/test_cli_json_contract.py tests/health/test_ffmpeg_bootstrap.py tests/surfaces/test_cli_update.py

      - name: Install PyInstaller and Inno Setup
        shell: pwsh
        run: |
          uv pip install pyinstaller
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Standalone Executable
        run: uv run pyinstaller --clean packaging/watch-skill.spec

      - name: Smoke test built executable
        shell: pwsh
        run: |
          $ver = ./dist/watch-skill-windows-x86_64.exe --version
          Write-Host "Built version: $ver"
          $expected = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($ver -ne $expected) {
            Write-Error "Version mismatch: expected '$expected', got '$ver'"
            exit 1
          }
          ./dist/watch-skill-windows-x86_64.exe doctor --json | Out-Null
          ./dist/watch-skill-windows-x86_64.exe config list --json | Out-Null
          ./dist/watch-skill-windows-x86_64.exe --help | Out-Null

      - name: Compile Windows Installer and Standalone Uninstaller
        shell: pwsh
        run: |
          $ver = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          iscc /DMyAppVersion=$ver packaging/windows/watch-skill-installer.iss
          iscc /DMyAppVersion=$ver packaging/windows/watch-skill-uninstaller.iss

      - name: E2E Test Installer and Standalone Uninstaller
        shell: pwsh
        run: |
          # 0. Setup pre-existing unmanaged skill in Claude to verify ownership invariant
          $claudeSkillDir = "$env:USERPROFILE\.claude\skills\watch-video-cli"
          New-Item -ItemType Directory -Force -Path $claudeSkillDir | Out-Null
          "user sentinel unmanaged skill content" | Set-Content (Join-Path $claudeSkillDir "SKILL.md") -NoNewline

          # 1. Test Silent Installation
          Start-Process -FilePath "./dist/watch-skill-installer.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

          # 2. Verify installed binary
          $appExe = "$env:LOCALAPPDATA\Programs\watch-skill\watch-skill.exe"
          if (-not (Test-Path $appExe)) { throw "Installed binary not found at $appExe" }
          $instVer = & $appExe --version
          Write-Host "Installed binary version: $instVer"
          & $appExe doctor --json | Out-Null

          # Verify Registry PATH
          $regPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if (-not $regPath.Contains("watch-skill")) { throw "PATH not updated in HKCU Environment" }

          # Verify Gemini skill is managed and deployed
          $geminiMarker = "$env:USERPROFILE\.gemini\config\skills\watch-video-cli\.watch-skill-managed"
          if (-not (Test-Path $geminiMarker)) { throw "Gemini skill marker missing" }

          # Verify Claude pre-existing unmanaged skill was NOT corrupted or marked
          $claudeMarker = Join-Path $claudeSkillDir ".watch-skill-managed"
          if (Test-Path $claudeMarker) { throw "Unmanaged Claude skill should NOT have received marker" }
          $claudeContent = Get-Content (Join-Path $claudeSkillDir "SKILL.md") -Raw
          if ($claudeContent -ne "user sentinel unmanaged skill content") { throw "Unmanaged Claude skill content was corrupted" }

          # 3. Test Standalone Uninstaller
          Start-Process -FilePath "./dist/watch-skill-uninstaller.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

          # Verify uninstallation
          if (Test-Path "$env:LOCALAPPDATA\Programs\watch-skill") { throw "App dir still exists after uninstall" }
          $regPathAfter = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if ($regPathAfter.Contains("watch-skill")) { throw "PATH still contains watch-skill after uninstall" }
          if (Test-Path "$env:USERPROFILE\.gemini\config\skills\watch-video-cli") { throw "Gemini skill directory still exists after uninstall" }

          # Verify unmanaged Claude skill was PRESERVED after uninstall
          if (-not (Test-Path (Join-Path $claudeSkillDir "SKILL.md"))) { throw "Unmanaged Claude skill was incorrectly deleted on uninstall" }
          $claudeContentAfter = Get-Content (Join-Path $claudeSkillDir "SKILL.md") -Raw
          if ($claudeContentAfter -ne "user sentinel unmanaged skill content") { throw "Unmanaged Claude skill content altered on uninstall" }

          # Cleanup sentinel
          Remove-Item -Recurse -Force $claudeSkillDir

          # 4. Idempotent test: run standalone uninstaller again
          Start-Process -FilePath "./dist/watch-skill-uninstaller.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @(
            "watch-skill-windows-x86_64.exe",
            "watch-skill-installer.exe",
            "watch-skill-uninstaller.exe"
          )
          $lines = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 "./dist/$f").Hash.ToLower()
            $lines += "$hash  $f"
          }
          $lines | Set-Content ./dist/SHA256SUMS.txt
          Get-Content ./dist/SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-skill-windows-packaging
          path: |
            dist/watch-skill-windows-x86_64.exe
            dist/watch-skill-installer.exe
            dist/watch-skill-uninstaller.exe
            dist/SHA256SUMS.txt

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/core-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload ${{ github.ref_name }} ./dist/watch-skill-windows-x86_64.exe ./dist/watch-skill-installer.exe ./dist/watch-skill-uninstaller.exe ./dist/SHA256SUMS.txt --clobber
