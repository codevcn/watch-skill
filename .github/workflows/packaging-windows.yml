name: Windows Packaging & Release

on:
  push:
    branches: [main]
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    name: Package and Verify Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies with packaging extra and dev group
        run: uv sync --extra cli --extra mcp --group dev

      - name: Run unit, bootstrap, contract, MCP, and update tests
        run: uv run pytest tests/surfaces/test_cli_config.py tests/surfaces/test_cli_moment.py tests/surfaces/test_cli_json_contract.py tests/surfaces/test_cli_update.py tests/surfaces/test_mcp_server.py tests/health/test_ffmpeg_bootstrap.py tests/health/test_agents_setup.py tests/test_update.py

      - name: Install PyInstaller and Inno Setup
        shell: pwsh
        run: |
          uv pip install pyinstaller
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Standalone onedir Distribution
        run: uv run pyinstaller --clean packaging/watch-skill.spec

      - name: Smoke test built executable (CLI + MCP stdio handshake)
        shell: pwsh
        run: |
          $exe = "./dist/watch-skill/watch-skill.exe"
          if (-not (Test-Path $exe)) { throw "Built executable not found at $exe" }
          if (-not (Test-Path "./dist/watch-skill/_internal")) { throw "PyInstaller _internal directory not found" }

          $ver = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version failed with exit code $LASTEXITCODE" }
          Write-Host "Built version: $ver"
          $expected = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($ver -ne $expected) {
            Write-Error "Version mismatch: expected '$expected', got '$ver'"
            exit 1
          }
          & $exe doctor --json | Out-Null
          & $exe config list --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "config list --json failed with exit code $LASTEXITCODE" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help failed with exit code $LASTEXITCODE" }
          & $exe update --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "update --help failed with exit code $LASTEXITCODE" }
          & $exe serve --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "serve --help failed with exit code $LASTEXITCODE" }

          # Verify frozen MCP server starts over stdio and exposes all 39 tools
          $env:PYTHONUTF8 = "1"
          uv run python -c @"
          import asyncio, pathlib
          from fastmcp import Client
          from fastmcp.client.transports import StdioTransport

          exe = str(pathlib.Path('./dist/watch-skill/watch-skill.exe').resolve())

          async def main():
              async with Client(StdioTransport(command=exe, args=['serve'])) as client:
                  tools = await client.list_tools()
                  assert len(tools) == 39, f'expected 39 tools, got {len(tools)}'
                  by_name = {t.name: t for t in tools}
                  wv = set(by_name['watch_video'].inputSchema.get('properties', {}).keys())
                  for k in ('resolution', 'timestamps', 'transcript_only', 'cloud_stt'):
                      assert k in wv, f'missing {k} in watch_video schema'
                  gm = set(by_name['get_moment'].inputSchema.get('properties', {}).keys())
                  assert 'max_frames' in gm, 'missing max_frames in get_moment schema'
                  print(f'Frozen MCP stdio handshake OK: {len(tools)} tools registered')

          asyncio.run(main())
          "@
          if ($LASTEXITCODE -ne 0) { throw "MCP stdio handshake failed" }

      - name: Compile Windows Installer and Standalone Uninstaller
        shell: pwsh
        run: |
          $ver = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          iscc /DMyAppVersion=$ver packaging/windows/watch-skill-installer.iss
          iscc /DMyAppVersion=$ver packaging/windows/watch-skill-uninstaller.iss

      - name: E2E Test Installer and Standalone Uninstaller
        shell: pwsh
        run: |
          # 0. Setup pre-existing unmanaged skill in Claude to verify ownership invariant
          $claudeSkillDir = "$env:USERPROFILE\.claude\skills\watch-video-cli"
          New-Item -ItemType Directory -Force -Path $claudeSkillDir | Out-Null
          "user sentinel unmanaged skill content" | Set-Content (Join-Path $claudeSkillDir "SKILL.md") -NoNewline

          # 1. Test Silent Installation
          Start-Process -FilePath "./dist/watch-skill-installer.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

          # 2. Verify installed onedir layout and binary
          $appDir = "$env:LOCALAPPDATA\Programs\watch-skill"
          $appExe = "$appDir\watch-skill.exe"
          $appInternal = "$appDir\_internal"
          if (-not (Test-Path $appExe)) { throw "Installed binary not found at $appExe" }
          if (-not (Test-Path $appInternal)) { throw "Installed _internal directory not found at $appInternal" }
          $instVer = (& $appExe --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Installed --version failed with exit code $LASTEXITCODE" }
          Write-Host "Installed binary version: $instVer"
          & $appExe doctor --json | Out-Null
          & $appExe update --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed update --help failed with exit code $LASTEXITCODE" }
          & $appExe serve --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed serve --help failed with exit code $LASTEXITCODE" }

          # Verify Registry PATH
          $regPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if (-not $regPath.Contains("watch-skill")) { throw "PATH not updated in HKCU Environment" }

          # Verify Gemini managed skills are deployed (both watch-video-extra and watch-video-cli)
          $geminiExtraMarker = "$env:USERPROFILE\.gemini\config\skills\watch-video-extra\.watch-skill-managed"
          if (-not (Test-Path $geminiExtraMarker)) { throw "Gemini watch-video-extra skill marker missing" }
          $geminiCliMarker = "$env:USERPROFILE\.gemini\config\skills\watch-video-cli\.watch-skill-managed"
          if (-not (Test-Path $geminiCliMarker)) { throw "Gemini watch-video-cli skill marker missing" }

          # Verify Claude pre-existing unmanaged skill was NOT corrupted or marked
          $claudeMarker = Join-Path $claudeSkillDir ".watch-skill-managed"
          if (Test-Path $claudeMarker) { throw "Unmanaged Claude skill should NOT have received marker" }
          $claudeContent = Get-Content (Join-Path $claudeSkillDir "SKILL.md") -Raw
          if ($claudeContent -ne "user sentinel unmanaged skill content") { throw "Unmanaged Claude skill content was corrupted" }

          # 3. Test Standalone Uninstaller
          Start-Process -FilePath "./dist/watch-skill-uninstaller.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

          # Verify uninstallation (including complete removal of _internal and managed skills)
          if (Test-Path $appInternal) { throw "App _internal dir still exists after uninstall" }
          if (Test-Path $appDir) { throw "App dir still exists after uninstall" }
          $regPathAfter = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if ($regPathAfter.Contains("watch-skill")) { throw "PATH still contains watch-skill after uninstall" }
          if (Test-Path "$env:USERPROFILE\.gemini\config\skills\watch-video-extra") { throw "Gemini watch-video-extra skill directory still exists after uninstall" }
          if (Test-Path "$env:USERPROFILE\.gemini\config\skills\watch-video-cli") { throw "Gemini watch-video-cli skill directory still exists after uninstall" }
          if (Test-Path "$env:USERPROFILE\.claude\skills\watch-video-extra") { throw "Claude watch-video-extra skill directory still exists after uninstall" }

          # Verify unmanaged Claude skill was PRESERVED after uninstall
          if (-not (Test-Path (Join-Path $claudeSkillDir "SKILL.md"))) { throw "Unmanaged Claude skill was incorrectly deleted on uninstall" }
          $claudeContentAfter = Get-Content (Join-Path $claudeSkillDir "SKILL.md") -Raw
          if ($claudeContentAfter -ne "user sentinel unmanaged skill content") { throw "Unmanaged Claude skill content altered on uninstall" }

          # Cleanup sentinel
          Remove-Item -Recurse -Force $claudeSkillDir

          # 4. Idempotent test: run standalone uninstaller again
          Start-Process -FilePath "./dist/watch-skill-uninstaller.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @(
            "watch-skill-installer.exe",
            "watch-skill-uninstaller.exe"
          )
          $lines = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 "./dist/$f").Hash.ToLower()
            $lines += "$hash  $f"
          }
          $lines | Set-Content ./dist/SHA256SUMS.txt
          Get-Content ./dist/SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-skill-windows-packaging
          path: |
            dist/watch-skill-installer.exe
            dist/watch-skill-uninstaller.exe
            dist/SHA256SUMS.txt

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/core-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @(
            "./dist/watch-skill-installer.exe",
            "./dist/watch-skill-uninstaller.exe",
            "./dist/SHA256SUMS.txt"
          )
          # Only create/publish release after all deterministic E2E installer & uninstaller tests pass
          $rel = gh release view ${{ github.ref_name }} 2>$null
          if (-not $rel) {
            gh release create ${{ github.ref_name }} @files --title "${{ github.ref_name }} - Windows Installer & Uninstaller" --notes "Official Watch Core release ${{ github.ref_name }} with verified Windows Installer, Standalone Uninstaller, and Concurrency-Safe Update Checker."
          } else {
            gh release upload ${{ github.ref_name }} @files --clobber
          }
